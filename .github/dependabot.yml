# Genere le 2026-08-22 apres l'audit du compte.
# Sans ce fichier, Dependabot remonte des alertes mais n'ouvre aucune PR.
# Les mineures et correctives sont groupees ; les majeures restent isolees.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctives:
        patterns: ["*"]
        update-types: ["minor", "patch"]
