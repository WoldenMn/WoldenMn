name: Rafraichir la banniere

# Les compteurs de la banniere sont des faits derives : ils ont un gardien
# plutot qu'une valeur ecrite a la main qui derive en silence.
on:
  schedule:
    - cron: '0 6 * * 1'      # tous les lundis, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verifier que le jeton de lecture est present
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROFILE_STATS_TOKEN absent. Sans lui, seuls les depots"
            echo "::error::publics seraient comptes et la banniere afficherait 1 au lieu de 45."
            echo "::error::Cree un PAT en lecture seule (classic: read:user + repo) et ajoute-le"
            echo "::error::dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Regenerer assets/banner.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python build_banner.py

      - name: Commiter si les compteurs ont bouge
        run: |
          if git diff --quiet -- assets/banner.svg; then
            echo "Compteurs inchanges, rien a commiter."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg
          git commit -m "chore(banner): refresh derived counters"
          git push
